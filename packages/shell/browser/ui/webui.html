<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Luma Browser</title>
    <link rel="stylesheet" href="./webui.css" />
  </head>
  <body>
    <!-- Unified SVG icon set (Lucide-style linear strokes) -->
    <svg xmlns="http://www.w3.org/2000/svg" style="display: none" aria-hidden="true">
      <symbol id="i-back" viewBox="0 0 24 24">
        <path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      </symbol>
      <symbol id="i-forward" viewBox="0 0 24 24">
        <path d="M9 18l6-6-6-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      </symbol>
      <symbol id="i-reload" viewBox="0 0 24 24">
        <path d="M21 12a9 9 0 1 1-2.64-6.36" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M21 3v6h-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      </symbol>
      <symbol id="i-stop" viewBox="0 0 24 24">
        <rect x="6.5" y="6.5" width="11" height="11" rx="1.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      </symbol>
      <symbol id="i-plus" viewBox="0 0 24 24">
        <path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      </symbol>
      <symbol id="i-x" viewBox="0 0 24 24">
        <path d="M18 6L6 18M6 6l12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      </symbol>
      <symbol id="i-settings" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8" />
        <path
          d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.01a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </symbol>
      <symbol id="i-globe" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8" />
        <path d="M3 12h18M12 3a15.3 15.3 0 0 1 0 18 15.3 15.3 0 0 1 0-18z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      </symbol>
      <symbol id="i-lock" viewBox="0 0 24 24">
        <rect x="5" y="11" width="14" height="9" rx="2" fill="none" stroke="currentColor" stroke-width="1.8" />
        <path d="M8 11V7a4 4 0 0 1 8 0v4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      </symbol>
      <symbol id="i-audio" viewBox="0 0 24 24">
        <path d="M11 5L6 9H3v6h3l5 4z" fill="currentColor" stroke="none" />
        <path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
      </symbol>
      <symbol id="i-search" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="1.8" />
        <path d="M21 21l-4.35-4.35" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      </symbol>
      <symbol id="i-open" viewBox="0 0 24 24">
        <path d="M7 17L17 7M7 7h10v10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      </symbol>
      <symbol id="i-minimize" viewBox="0 0 24 24">
        <path d="M5 12h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      </symbol>
      <symbol id="i-maximize" viewBox="0 0 24 24">
        <rect x="5" y="5" width="14" height="14" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8" />
      </symbol>
      <symbol id="i-restore" viewBox="0 0 24 24">
        <rect x="4" y="8" width="12" height="12" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8" />
        <path d="M8 8V5.5A1.5 1.5 0 0 1 9.5 4H18a1.5 1.5 0 0 1 1.5 1.5V14a1.5 1.5 0 0 1-1.5 1.5H16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      </symbol>
    </svg>

    <div class="topbar">
      <div id="tabstrip">
        <div class="tab-container">
          <ul class="tab-list">
            <template id="tabtemplate">
              <li class="tab" tabindex="0">
                <img class="favicon" alt="" />
                <span class="favicon-placeholder"></span>
                <span class="title"></span>
                <div class="controls">
                  <button class="control audio" disabled title="Audio playing">
                    <svg class="icon" aria-hidden="true"><use href="#i-audio" /></svg>
                  </button>
                  <button class="control close" title="Close tab">
                    <svg class="icon" aria-hidden="true"><use href="#i-x" /></svg>
                  </button>
                </div>
              </li>
            </template>
          </ul>
          <button id="createtab" title="New tab">
            <svg class="icon" aria-hidden="true"><use href="#i-plus" /></svg>
          </button>
          <div class="app-drag"></div>
          <div class="window-controls">
            <button id="minimize" class="control" title="Minimize">
              <svg class="icon" aria-hidden="true"><use href="#i-minimize" /></svg>
            </button>
            <button id="maximize" class="control" title="Maximize">
              <svg class="icon" aria-hidden="true"><use href="#i-maximize" /></svg>
            </button>
            <button id="close" class="control close" title="Close window">
              <svg class="icon" aria-hidden="true"><use href="#i-x" /></svg>
            </button>
          </div>
        </div>
      </div>

      <div class="toolbar">
        <div class="page-controls">
          <button id="goback" class="control-btn" title="Back" disabled>
            <svg class="icon" aria-hidden="true"><use href="#i-back" /></svg>
          </button>
          <button id="goforward" class="control-btn" title="Forward" disabled>
            <svg class="icon" aria-hidden="true"><use href="#i-forward" /></svg>
          </button>
          <button id="reload" class="control-btn" title="Reload">
            <svg class="icon" aria-hidden="true"><use href="#i-reload" /></svg>
          </button>
        </div>

        <div class="address-bar">
          <span class="site-status" title="">
            <svg class="icon" aria-hidden="true"><use href="#i-globe" /></svg>
          </span>
          <input id="addressurl" spellcheck="false" autocomplete="off" placeholder="Search or enter address" />
          <button class="address-go" title="Open">
            <svg class="icon" aria-hidden="true"><use href="#i-open" /></svg>
          </button>
        </div>

        <browser-action-list id="actions" alignment="bottom left"></browser-action-list>

        <button id="settings-btn" class="control-btn" title="Settings">
          <svg class="icon" aria-hidden="true"><use href="#i-settings" /></svg>
        </button>
      </div>
    </div>

    <script src="./accents.js"></script>
    <script src="./navigation.js"></script>
    <script src="./webui.js"></script>
  </body>
</html>
